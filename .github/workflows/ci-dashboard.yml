name: Dashboard CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci-dashboard.yml'
  push:
    branches:
      - '**'

jobs:
  seo-artifact:
    name: SEO artifact gate
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: SEO prerender env preflight
        run: |
          node -e "
            const missing = [];
            if (!process.env.VITE_SUPABASE_URL) missing.push('VITE_SUPABASE_URL');
            if (!process.env.VITE_SUPABASE_PUBLISHABLE_KEY) missing.push('VITE_SUPABASE_PUBLISHABLE_KEY');
            if (missing.length) {
              console.error('SEO prerender env ausente: ' + missing.join(', ') + '. Configure em Settings > Secrets and variables > Actions (URL como Variable, chave publishable/anon como Secret).');
              process.exit(1);
            }
            console.log('SEO prerender env presente (valores não exibidos).');
          "

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: SEO validate
        run: pnpm seo:validate

      - name: SEO audit
        run: pnpm seo:audit

      - name: SEO safety tests
        run: pnpm exec vitest run src/tests/seo/seo-safety.test.ts

      - name: Verify SEO artifacts
        run: node scripts/verify-seo-artifacts.mjs

      - name: Upload dist artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist-seo
          path: dist/
          include-hidden-files: true
          if-no-files-found: error

  full-regression:
    name: Full regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test:run

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
