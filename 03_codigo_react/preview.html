function metrics(){return `<div class="grid6">${mod.metrics.map((m,i)=>`<div class="surface kpi"><div class="kpi-top"><div class="kpi-icon">${['♧','▣','◈','◎','◴','▥'][i]}</div><span class="kpi-label">${h(m.label)}</span></div><div class="kpi-value">${fa(m.value)}</div><div class="kpi-foot"><span class="${m.delta>0?'positive':'negative'}">${m.delta>0?'▲':'▼'} ${Math.abs(m.delta).toFixed(1).replace('.',',')}%</span><span>vs. período anterior</span></div></div>`).join('')}</div>`}
function series(seed){return Array.from({length:16},(_,i)=>{const n=(seed*11+(i*3)**2+Math.sin(i*1.6+seed)*22 + i*5)%110;return 65+Math.abs(n)*1.15;})}
function chart(){const vals=series(mod.id.length*7);const vals2=vals.map((v,i)=>v*.45+17+Math.sin(i)*14);const xs=vals.map((_,i)=>35+i*43.7);const points=vals.map((v,i)=>`${xs[i].toFixed(1)},${(223-v).toFixed(1)}`).join(' ');const points2=vals2.map((v,i)=>`${xs[i].toFixed(1)},${(223-v).toFixed(1)}`).join(' ');const svg=`<svg class="chart-svg" viewBox="0 0 730 250" preserveAspectRatio="none" aria-label="Gráfico ilustrativo de tendência"><defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#6a88ff" stop-opacity=".30"/><stop offset="1" stop-color="#6a88ff" stop-opacity=".01"/></linearGradient></defs>${[35,75,115,155,195,235].map(y=>`<line x1="34" x2="710" y1="${y}" y2="${y}" stroke="#e9edf6" stroke-width="1"/>`).join('')}${[0,1,2,3,4,5].map((n)=>`<text x="4" y="${234-n*40}" fill="#96a2b7" font-size="10">${n*20}</text>`).join('')}<polygon points="35,240 ${points} 690,240" fill="url(#fill)"/><polyline points="${points}" fill="none" stroke="#4664ec" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="${points2}" fill="none" stroke="#20b8bd" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>${[0,3,6,9,12,15].map(i=>`<circle cx="${xs[i]}" cy="${223-vals[i]}" r="4" fill="white" stroke="#4664ec" stroke-width="2.5"/><text x="${xs[i]-14}" y="248" font-size="10" fill="#8c98af">${i+1} nov</text>`).join('')}</svg>`;return `<div class="surface panel chartpanel"><div class="panelhead"><div><strong>Evolução de ${h(mod.resource)}</strong><span class="panelsub">Tendência e comparação · exemplo ilustrativo</span></div><span class="badge">◷ Últimos 30 dias ⌄</span></div>${svg}<div class="legend"><span><i class="ldot"></i>Volume do período</span><span class="second"><i class="ldot"></i>Período anterior</span></div></div>`}
function donut(){return `<div class="surface panel distribution"><div class="panelhead"><div><strong>Distribuição por situação</strong><span class="panelsub">Segmentação da operação · demonstração</span></div><span class="badge">Ver por estado ⌄</span></div><div class="donutgrid"><div class="donut"><div class="donutcenter"><strong>${fa(mod.metrics[1].value)}</strong><small>Registros</small></div></div><div class="distlist">${mod.stages.map((s,i)=>`<div class="distrow"><span><i class="distdot" style="background:${['#395bea','#6975ed','#24b9ba','#f1b459','#bcc9e2'][i]}"></i>${h(s)}</span><b>${[37,25,16,12,10][i]}%</b></div>`).join('')}</div></div></div>`}
function pipeline(){return `<div class="surface panel pipeline"><div class="pipeline-head"><div><strong>Fluxo de ${h(mod.resource)} — visão de etapas</strong><span class="panelsub">Fila operacional por status com transições autorizadas</span></div><a class="link" href="${q(mod.id,'list')}">Ver todos →</a></div><div class="steps">${mod.stages.map((stage,i)=>`<div class="step"><div class="stephead"><span>${h(stage)}</span><b>${fa(Math.max(1,Math.floor(mod.metrics[0].value/(i+1))))}</b></div>${[0,1,2].map((k)=>`<div class="minientry"><span>${['A','R','M','C','J'][(i+k)%5]}</span>${h(mod.rows[(i+k)%mod.rows.length])}</div>`).join('')}<div class="stepmore">＋ Abrir etapa</div></div>`).join('')}</div></div>`}
function activity(){return `<div class="surface panel activity"><div class="panelhead"><strong>Atividade e pendências recentes</strong><a class="link" href="${q(mod.id,'detail')}">Histórico completo →</a></div>${[0,1,2,3].map((i)=>`<div class="activityrow"><div class="activityicon">${['↗','✓','◷','▣'][i]}</div><div><strong>${h(['Atualização de registro','Etapa registrada','Revisão pendente','Novo vínculo identificado'][i])}: ${h(mod.rows[i])}</strong><small>${['há 9 min','há 31 min','há 2 horas','ontem, 16:20'][i]} · Fluxo ${h(mod.label)} · Exemplo ilustrativo</small></div></div>`).join('')}</div>`}
function tableRow(name,i){return `<tr><td><input type="checkbox" aria-label="Selecionar registro ${i+1}"/></td><td><span class="rowitem">${h(name)}</span><br><span style="font-size:9px;color:#94a1b4">REF-${String(i+1).padStart(4,'0')}</span></td><td>${h(['Principal','Operacional','Regional','Externo','Administrativo'][i%5])}</td><td>${h(['07/11/2026','05/11/2026','02/11/2026','30/10/2026','25/10/2026'][i%5])}</td><td><span class="badge ${['badge-green','badge-blue','badge-amber','badge-green','badge-red'][i%5]}">${['Ativo','Em andamento','Pendente','Concluído','Revisão'][i%5]}</span></td><td><a class="link" href="${q(mod.id,'detail')}">Ver detalhes ↗</a> &nbsp; <a href="${q(mod.id,'edit')}">✎</a></td></tr>`}
function table(full=false){const rows=full?[...mod.rows,...mod.rows.map(s=>s+' · extensão'),...mod.rows.map(s=>s+' · revisão')]:mod.rows;return `<div class="surface tablecard"><div class="tabletop"><div><strong>${h(mod.label)} · Registros e ações</strong><span class="panelsub">Consulta, filtros, ordenação e operações por recurso</span></div><div><a class="link" href="${q(mod.id,'list')}">Abrir listagem →</a></div></div><div class="tablefilters"><input class="fieldline" placeholder="Buscar por nome, código, referência..."/><select class="fieldline tiny"><option>Todas as situações</option><option>Ativo</option></select><select class="fieldline tiny"><option>Todas as categorias</option></select><button class="btn">☷ Mais filtros</button></div><table class="datatable"><thead><tr><th>☐</th><th>${h(mod.headers[0])}</th><th>${h(mod.headers[1])}</th><th>${h(mod.headers[2])}</th><th>${h(mod.headers[4])}</th><th>Ações</th></tr></thead><tbody>${rows.map(tableRow).join('')}</tbody></table><div class="tablefooter"><span>Mostrando 1–${rows.length} de ${fa(mod.metrics[0].value)} registros · Exemplo de UI</span><div class="pages"><span>‹</span><span class="active">1</span><span>2</span><span>3</span><span>…</span><span>›</span></div></div></div>`}
function dash(){return header()+metrics()+`<div class="twocol">${chart()}${donut()}</div><div class="lowergrid">${pipeline()}${activity()}</div>`+table()}
function listing(){return header('Gerenciar '+mod.resource,`Listagem operacional de ${mod.resource} com filtros, paginação e acesso independente ao cadastro.`)+`<div class="specialbanner"><div><strong>CRUD separado da criação e da edição</strong><br><small>Clique em um registro para detalhes; criar/editar abre uma página própria com formulário validado.</small></div><a class="btn btn-primary" href="${q(mod.id,'new')}">＋ ${h(mod.primaryAction)}</a></div>`+metrics()+table(true)}
function getFields(){const custom={
'admin-tenant':[['Nome completo','text','Nome completo do usuário'],['E-mail corporativo','email','nome@empresa.com.br'],['Telefone','tel','(11) 99999-9999'],['Papel autorizado','select','Selecione uma permissão'],['Tenant / Organização','select','Selecionar organização'],['Unidade / Equipe','select','Selecionar unidade'],['Motivo do acesso','textarea','Descreva o motivo da criação']],
'admin-master':[['Razão social','text','Nome da organização'],['Nome fantasia','text','Nome público'],['Identificador fiscal','text','Identificador da entidade'],['Responsável','text','Nome do responsável'],['E-mail de contato','email','contato@empresa.com.br'],['Plano','select','Selecione o plano'],['Descrição institucional','textarea','Informações de governança']],
'candidato':[['Cargo de interesse','text','Cargo ou especialidade'],['Empresa','text','Nome da empresa'],['Modelo de trabalho','select','Presencial / Híbrido / Remoto'],['Localidade','text','Cidade e estado'],['Pretensão salarial','text','Valor informado'],['Experiência','textarea','Contexto e detalhes da experiência']],
'recrutamento':[['Título da vaga','text','Ex.: Controlador de Acesso'],['Empresa / Tenant','select','Selecione a empresa'],['Cidade e UF','text','Local da vaga'],['Tipo de contrato','select','CLT / Temporário / PJ'],['Faixa salarial','text','Valor ou a combinar'],['Descrição da vaga','textarea','Requisitos, atribuições e benefícios']],
'rh':[['Nome completo','text','Nome do colaborador'],['Cargo','text','Função e cargo'],['Unidade','select','Selecione unidade'],['Tipo de vínculo','select','CLT / Temporário / Prestador'],['Data de admissão','date',''],['Observações','textarea','Dados complementares']],
'financeiro':[['Descrição do lançamento','text','Referência do lançamento'],['Centro de custo','select','Selecionar centro de custo'],['Competência','date',''],['Vencimento','date',''],['Valor','text','R$ 0,00'],['Descrição','textarea','Observações do lançamento']],
'servicos':[['Nome do serviço','text','Título exibido no site'],['Categoria','select','Selecionar categoria'],['Responsável','select','Selecionar responsável'],['Status editorial','select','Rascunho / Em revisão'],['Imagem principal','text','Selecionar na biblioteca de mídia'],['Descrição','textarea','Descrição do serviço']]
};return custom[mod.id]||[['Título do registro','text','Nome ou identificação'],['Categoria','select','Selecionar categoria'],['Tenant / Contexto','select','Selecione organização'],['Responsável','text','Nome do responsável'],['Data de referência','date',''],['Descrição detalhada','textarea','Descrição, contexto e dados operacionais']]}
function form(edit=false){const fields=getFields();const name=edit?'Editar '+mod.singular:mod.primaryAction;return header(name,`Página exclusiva de ${edit?'edição':'criação'} — o formulário não está misturado ao dashboard ou à listagem.`)+`<div class="form-layout"><aside class="surface steplist"><div class="panelhead"><strong>Etapas do processo</strong></div>${[['Dados principais','Identificação e informações obrigatórias'],['Contexto e vínculo','Tenant, categoria e permissões'],['Documentos e referências','Mídia, anexos e justificativas'],['Revisão','Confirmar dados antes de persistir']].map((a,i)=>`<div class="stepnav ${i===0?'on':''}"><div class="stepnumber">${i+1}</div><div><strong>${a[0]}</strong><small>${a[1]}</small></div></div>`).join('')}</aside><div class="surface formcard"><div class="sectionhead"><div class="badge badge-blue">ETAPA 1 DE 4</div><h2 style="margin-top:9px">${h(edit?'Alterar informações':'Dados de '+mod.singular)}</h2><p>Preencha as informações principais. Nada será enviado nesta referência visual.</p></div><div class="formgrid">${fields.map((f,i)=>{const [label,type,placeholder]=f;return `<div class="formfield ${type==='textarea'?'full':''}"><label>${h(label)} ${i<2?'<span class="required">*</span>':''}</label>${type==='textarea'?`<textarea placeholder="${h(placeholder)}"></textarea>`:type==='select'?`<select><option>${h(placeholder)}</option><option>Opção ilustrativa A</option><option>Opção ilustrativa B</option></select>`:`<input type="${h(type)}" placeholder="${h(placeholder)}"/>`}<small>${i<2?'Campo requerido por contrato funcional':'Verificar validações da célula antes de implementar'}</small></div>`}).join('')}</div><div class="form-actions"><a class="btn" href="${q(mod.id,'list')}">← Cancelar e voltar</a><div><button class="btn" onclick="alert('Protótipo visual: nada foi salvo.')">Salvar rascunho</button> <button class="btn btn-primary" onclick="alert('Protótipo visual. Integrar a operação autorizada do módulo; sem alteração de banco.')">Continuar para vínculos →</button></div></div></div><aside class="rightstack"><div class="surface help"><h3>✓ Como cadastrar corretamente</h3><p>Este fluxo deve executar somente operações específicas da célula.</p><ul><li>Validar todos os campos com schema tipado.</li><li>Confirmar tenant e contexto selecionado.</li><li>Carregar permissões efetivas do usuário.</li><li>Persistir somente após confirmação do backend.</li><li>Exibir sucesso, erro e histórico com evidências.</li></ul><div class="highlight-note">Protótipo de interface. Não usa dados reais, não concede permissões e não persiste registros.</div></div><div class="surface help"><h3>◈ Mídia e documentos</h3><p>Se este recurso exigir anexos, incluir uma etapa dedicada conectada à célula Media e aos buckets autorizados.</p></div></aside></div>`}
function detail(){return header('Detalhes · '+mod.rows[0],`Página detalhada com dados, entidades relacionadas, histórico e ações — isolada do formulário.`)+`<div class="viewtabs"><a class="active" href="#">Visão Geral</a><a href="#">Relacionamentos</a><a href="#">Documentos</a><a href="#">Histórico</a><a href="#">Auditoria</a></div><div class="detailgrid"><div class="rightstack"><div class="surface formcard"><div class="panelhead"><strong>Informações do ${h(mod.singular)}</strong><a class="btn btn-primary" href="${q(mod.id,'edit')}">✎ Editar registro</a></div><div class="infocards">${[ ['Nome / Identificação',mod.rows[0]],['Status','Em andamento'],['Domínio',mod.label],['Contexto','Tenant de demonstração'],['Responsável','Equipe autorizada'],['Última atualização','08/11/2026, 17:40'] ].map(([a,b])=>`<div class="infocard"><small>${h(a)}</small><strong>${h(b)}</strong></div>`).join('')}</div><div class="sectionhead" style="margin-top:24px"><h2>Vínculos e operações</h2><p>Operações acessíveis somente mediante autorização real</p></div><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn" onclick="alert('Protótipo visual: sem operação real.')">▣ Abrir histórico</button><button class="btn">◷ Ver evidências</button><button class="btn">▤ Documentos</button><button class="btn">◎ Entidades relacionadas</button></div></div><div class="surface panel"><div class="panelhead"><strong>Relacionamentos da célula</strong></div>${mod.rows.slice(1).map((r,i)=>`<div class="activityrow"><div class="activityicon">↗</div><div><strong>${h(r)}</strong><small>Entidade vinculada · Relação ilustrativa ${i+1}</small></div></div>`).join('')}</div></div><div class="rightstack"><div class="surface panel"><div class="panelhead"><strong>Evolução e auditoria</strong></div><div class="timeline">${mod.stages.map((r,i)=>`<div class="event"><b>${i<3?'✓':i===3?'•':'○'}</b><div><strong>${h(r)}</strong><small>${i<3?'Evento registrado':'Etapa futura'} · Exemplo visual</small></div></div>`).join('')}</div></div><div class="surface help"><h3>Próximas ações permitidas</h3><p>Validar status e política antes de avançar etapa, editar, delegar ou arquivar.</p><a class="btn btn-primary" href="${q(mod.id,'edit')}">Editar informações →</a></div></div></div>`}
function render(){document.querySelector('#root').innerHTML=`<div class="layout">${side()}<section class="workspace">${topbar()}<main class="main">${view==='new'?form():view==='edit'?form(true):view==='detail'?detail():view==='list'?listing():dash()}<div class="footerstatus" style="margin:21px 0 0"><i class="statusdot"></i>CHECK BOULER 24H · Referência visual independente do sistema real &nbsp;|&nbsp; sem CRUD produtivo &nbsp;|&nbsp; layout enterprise proposto</div></main></section></div><div class="demo">REFERÊNCIA VISUAL — DADOS FICTÍCIOS / SEM CONEXÃO</div>`}
window.renderPreview=(cell,v)=>{mod=modules.find(m=>m.id===cell)||modules[0];view=v;render()};
render();
</script></body></html>
